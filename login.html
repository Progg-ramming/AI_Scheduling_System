<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — MindFlow</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>(function(){ emailjs.init("5_WIgtmGO525X4fyG"); })();</script>
</head>
<body class="auth-page">

<header class="site-header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-seedling"></i></div>
      <h1>Mind<span>Flow</span></h1>
    </div>
    <nav class="main-nav">
      <a href="index.html" style="font-size:.85rem;color:var(--text2);">← Home</a>
    </nav>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-form-side">
      <h2>Welcome back</h2>
      <p class="subtitle">"Take a deep breath and let calmness guide you."</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required/>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn" style="width:100%;justify-content:center;border-radius:var(--r-sm);">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up here</a>
      </div>
    </div>

    <div class="auth-visual-side">
      <div style="position:relative;z-index:1;">
        <div class="auth-circle"></div>
        <div class="auth-circle"></div>
        <div class="auth-circle"></div>
      </div>
      <div class="auth-visual-text">
        <div class="big-icon"><i class="fas fa-brain"></i></div>
        <h3>AI-Powered Wellness</h3>
        <p>Your stress-aware scheduler that adapts to how you feel — every single day.</p>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
